name = "jlpt-telegram"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
# Comma-separated list of origins allowed to call this worker.
# Set it to your app's address, for example "https://noerror-web.github.io".
# Leave empty only while testing.
ALLOWED_ORIGIN = ""

# Secrets — set these, never commit them:
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
#   npx wrangler secret put TELEGRAM_CHAT_ID
